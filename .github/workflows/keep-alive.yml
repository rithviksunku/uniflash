name: Supabase keep-alive

on:
  schedule:
    # 3× per day: 08:00, 14:00, 20:00 UTC — 15 distinct DB requests/day
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch: # also allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: uniflash/package-lock.json

      - name: Install dependencies
        working-directory: uniflash
        run: npm ci

      - name: Ping database
        working-directory: uniflash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keep-alive.js
